services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args:
        NODE_VERSION: 24.12.0
    container_name: typescript-playwright-scraper
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - ./src:/app/src:delegated
      - ./tests:/app/tests:delegated
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./data:/app/data
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  app-network:
    driver: bridge
    name: typescript-playwright-scraper-network
